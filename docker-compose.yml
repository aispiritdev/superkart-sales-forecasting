version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "7860:7860"
    networks:
      - superkart-network

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://host.docker.internal:7860
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - superkart-network

networks:
  superkart-network:
    driver: bridge
